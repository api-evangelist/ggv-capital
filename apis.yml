aid: ggv-capital
name: GGV Capital
description: >-
  GGV Capital (Granite Global Ventures) was a global, multi-stage venture capital
  firm founded in 2000 and headquartered in Menlo Park, California, with offices
  in San Francisco, Shanghai, Beijing, and Singapore. GGV invested from seed
  through growth stage across Social/Internet and consumer, Enterprise Tech and
  SaaS, and Smart Tech (fintech, infrastructure, developer tools, cybersecurity,
  AI, and cross-border commerce), with a distinctive US–Asia bridge thesis. At
  its peak the firm managed roughly $9.2B in assets under management and backed
  more than 400 companies, including 44 unicorns and dozens of IPOs — among them
  Airbnb, Slack, Square, Affirm, HashiCorp, Coinbase, Peloton, Opendoor,
  Poshmark, StockX, BigCommerce, Grab, Alibaba, ByteDance, Zendesk, and Xpeng.
  On March 29, 2024 GGV Capital ceased using the GGV brand and split into two
  independent successor firms amid US–China tensions: Notable Capital
  (US/international, led by Hans Tung and Glenn Solomon, ~$4.2B AUM) and Granite
  Asia (Asia, led by Jenny Lee and Jixun Foo, ~$5B AUM). The former ggvc.com
  companies surface now redirects to Notable Capital, which carries the
  US/international portfolio graph. This profile tracks GGV Capital's identity
  and portfolio graph across the API Evangelist network.
